name: CI/CD Pipeline - Billing Service

on:
  push:
    branches: [ main, feature/fase-4 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: tc-oficina-billing-service
  K8S_NAMESPACE: oficina-billing
  K8S_DEPLOYMENT: tc-oficina-billing-service

jobs:
  build:
    name: Build, testes, cobertura e SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, testes e cobertura (JaCoCo >= 85%)
        run: mvn -B clean verify

      - name: Analise de qualidade (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.qualitygate.wait=true

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  deploy:
    name: Imagem no ECR e deploy no k3s
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Atualizar imagePullSecret do ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          ECR_PASSWORD=$(aws ecr get-login-password --region $AWS_REGION)
          ssh -i ~/.ssh/deploy_key ubuntu@"${{ secrets.EC2_HOST }}" \
            "sudo k3s kubectl create secret docker-registry ecr-registry --docker-server=$REGISTRY --docker-username=AWS --docker-password='$ECR_PASSWORD' -n $K8S_NAMESPACE --dry-run=client -o yaml | sudo k3s kubectl apply -f -"
      - name: Build e push da imagem
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy no cluster k3s
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          tar -czf - k8s | ssh -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" \
            "rm -rf /tmp/tc-oficina-billing-service && mkdir -p /tmp/tc-oficina-billing-service && tar -xzf - -C /tmp/tc-oficina-billing-service && sudo k3s kubectl apply -f /tmp/tc-oficina-billing-service/k8s/"
          ssh -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" \
            "sudo k3s kubectl set image deployment/$K8S_DEPLOYMENT $K8S_DEPLOYMENT=$IMAGE -n $K8S_NAMESPACE && sudo k3s kubectl rollout status deployment/$K8S_DEPLOYMENT -n $K8S_NAMESPACE --timeout=300s"