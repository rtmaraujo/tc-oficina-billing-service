name: CI/CD Pipeline - Billing Service

on:
  push:
    branches: [ main, feature/fase-4, develop ]
  pull_request:
    branches: [ main, feature/fase-4 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Run Tests
      run: mvn -B test --file pom.xml

    - name: Coverage Check (>=85%)
      run: mvn -B verify --file pom.xml

  build-and-push:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, aws-academy]
    environment: production
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-west-2
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: github-actions-billing

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tc-oficina-billing-service
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/tc-oficina-billing-service tc-oficina-billing-service=${{ steps.login-ecr.outputs.registry }}/tc-oficina-billing-service:${{ github.sha }} --namespace=oficina-billing
        kubectl rollout status deployment/tc-oficina-billing-service --namespace=oficina-billing

