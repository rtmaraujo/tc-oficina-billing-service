apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: oficina-billing
type: Opaque
stringData:
  # Copie este arquivo para k8s/secret.yaml e preencha com os valores reais.
  # k8s/secret.yaml está no .gitignore e NÃO deve ser commitado.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://SEU_RDS:5432/oficina_billing"
  SPRING_DATASOURCE_USERNAME: "oficina_user"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"
  MERCADOPAGO_ACCESS_TOKEN: "TEST-CHANGE_ME"
  MERCADOPAGO_WEBHOOK_SECRET: "CHANGE_ME"
