apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina-billing
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT: "8082"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.oficina-infra.svc.cluster.local:9092"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MERCADOPAGO_BASE_URL: "https://api.mercadopago.com"
  MERCADOPAGO_NOTIFICATION_URL: "http://44.253.115.185/webhook/mercadopago"
  PAGAMENTO_PROVIDER: "mock"
  BILLING_VALOR_PADRAO: "500.0"
  ZIPKIN_ENDPOINT: "http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans"
