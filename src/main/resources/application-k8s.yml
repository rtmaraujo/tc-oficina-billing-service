server:
  port: 8082

spring:
  application:
    name: tc-oficina-billing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://billing-db:5432/oficina_billing}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_user}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.oficina-infra.svc.cluster.local:9092}
    consumer:
      group-id: billing-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-xxxx}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:xxxx}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://44.253.115.185/webhook/mercadopago}
  back-url: ${MERCADOPAGO_BACK_URL:http://44.253.115.185/billing/}
  base-url: https://api.mercadopago.com

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{sagaId:-}]"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    config-url: /billing/v3/api-docs/swagger-config
    url: /billing/v3/api-docs


pagamento:
  provider: ${PAGAMENTO_PROVIDER:mock}

billing:
  valor-padrao: ${BILLING_VALOR_PADRAO:500.0}
