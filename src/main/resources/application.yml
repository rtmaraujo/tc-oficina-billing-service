server:
  port: 8082

spring:
  application:
    name: tc-oficina-billing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oficina_billing
    username: oficina_user
    password: oficina_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: billing-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


pagamento:
  provider: ${PAGAMENTO_PROVIDER:mock}

billing:
  valor-padrao: ${BILLING_VALOR_PADRAO:500.0}
